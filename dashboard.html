<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>
<style>
body {
    margin:0;
    font-family:'Inter', sans-serif;
    background:#f5f5f7;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 1.5rem;
    background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,0.05);
    position:sticky;
    top:0;
    z-index:10;
}
.logo{ font-weight:700; font-size:1.3rem; }
.hamburger{ font-size:1.6rem; cursor:pointer; }

/* HAMBURGER MENU */
.menu {
    position:fixed;
    top:0; left:-250px;
    width:250px;
    height:100%;
    background:#fff;
    box-shadow:2px 0 15px rgba(0,0,0,0.2);
    padding:2rem 1rem;
    transition:0.3s;
    z-index:100;
}
.menu.show{ left:0; }
.menu h3{ margin-bottom:1.5rem; }
.menu button{
    display:block;
    width:100%;
    padding:0.8rem;
    margin-bottom:0.5rem;
    border:none;
    background:#f2f2f2;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}
.menu button:hover{ background:#000; color:#fff; }

/* PROFILE & GREETING */
.greeting-container{
    padding:1rem 1.5rem 0;
    font-weight:600;
    font-size:1.2rem;
}

/* TOGGLE SWITCH */
.toggle-container{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:1rem 1.5rem;
    gap:1rem;
}
.toggle-btn{
    padding:0.5rem 1.2rem;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}
.toggle-btn.active{ background:#000; color:#fff; }
.toggle-btn.inactive{ background:#f2f2f2; color:#000; }

/* WALLET CARD */
.wallet-card-container{ padding:1rem 1.5rem 2rem; display:flex; justify-content:center; }
.wallet-card{
    width:320px;
    height:180px;
    border-radius:20px;
    background:#000;
    color:#fff;
    padding:1rem;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}
.wallet-card .currency-tabs{
    position:absolute;
    top:50%;
    right:-45px;
    display:flex;
    flex-direction:column;
    transform:translateY(-50%);
    gap:10px;
}
.currency-tab{
    background:#fff;
    color:#000;
    padding:0.3rem 0.7rem;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
    font-size:0.85rem;
}
.balance-label{opacity:0.7;font-size:0.85rem;}
.balance-amount{font-size:1.8rem;font-weight:700;margin:0.5rem 0;}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;}
.action-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(255,255,255,0.1);backdrop-filter:blur(5px);padding:0.7rem;border-radius:12px;cursor:pointer;transition:0.3s;font-size:0.75rem;}
.action-btn:hover{background:rgba(255,255,255,0.2);transform:translateY(-2px);}
.icon{font-size:1.1rem;}

/* VIRTUAL POS */
.pos-row{display:flex;gap:1rem;padding:0 1.5rem 1rem;overflow-x:auto;}
.pos-card{min-width:190px;background:#fff;border-radius:18px;padding:1rem;box-shadow:0 8px 25px rgba(0,0,0,0.08);cursor:pointer;transition:0.3s;}
.pos-card:hover{transform:translateY(-3px);}

/* MODAL */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:50;}
.modal-content{background:#fff;padding:2rem;border-radius:20px;width:90%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.2);}
.modal-content input{width:100%;padding:0.8rem;margin:0.6rem 0;border-radius:10px;border:1px solid #ccc;}
.modal-content button{padding:0.8rem 1rem;border:none;border-radius:10px;background:#000;color:#fff;font-weight:600;cursor:pointer;}
</style>
</head>
