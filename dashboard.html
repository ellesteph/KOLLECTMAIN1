<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect</title>

<!-- Fonts & Scripts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://checkout.flutterwave.com/v3.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body { margin:0; font-family:'Inter', sans-serif; background:#fff; color:#000; }
header { padding:1rem 2rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #000; position:sticky; top:0; background:#fff; z-index:10;}
header h1 { margin:0; font-weight:700; }
header .profile { display:flex; align-items:center; gap:0.5rem; cursor:pointer; }
header .profile img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
header button.logout { background:#000; color:#fff; border:none; padding:0.5rem 1rem; cursor:pointer; border-radius:6px; transition:0.3s; }
header button.logout:hover { opacity:0.85; transform:translateY(-2px); }

.container { max-width:1000px; margin:2rem auto; padding:2rem; }

/* Tabs */
.tab-bar { display:flex; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }
.tab-bar button { flex:1; padding:0.8rem; border:none; border-radius:6px; font-weight:600; cursor:pointer; background:#000; color:#fff; transition:0.3s; }
.tab-bar button.active { background:#fff; color:#000; border:2px solid #000; }

/* Tab content */
.tab-content { display:none; opacity:0; transform:translateY(20px); transition:0.5s ease; }
.tab-content.active { display:block; opacity:1; transform:translateY(0); }

/* Wallet Section */
.wallet-section { margin-bottom:2rem; }
.currency-tabs { display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; }
.currency-tab { flex:1; text-align:center; padding:0.5rem 0.8rem; border-radius:10px; background:#eee; cursor:pointer; font-weight:600; transition:0.3s; }
.currency-tab.active { background:#000; color:#fff; }
.currency-tab.more { background:#ccc; }

.wallet-card { position:relative; background:linear-gradient(135deg,#000,#333); color:#fff; border-radius:16px; padding:2rem 1.5rem 1.5rem 1.5rem; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.2); transition:0.3s; }
.wallet-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,0,0,0.3); }
.card-top-curve { position:absolute; top:0; left:0; width:100%; height:50px; background:#fff; clip-path:ellipse(120% 100% at 50% 0%); opacity:0.15; }
.wallet-header { display:flex; justify-content:space-between; font-weight:600; font-size:0.95rem; margin-bottom:1rem; position:relative; z-index:1; }
.wallet-balance { font-size:1.5rem; font-weight:700; margin-bottom:1rem; position:relative; z-index:1; }
.wallet-actions button { margin-right:0.5rem; margin-top:0.5rem; }

/* Other tabs content */
input, select { width:100%; padding:0.8rem; margin:0.8rem 0; border:1px solid #000; border-radius:6px; font-size:1rem; transition:0.3s; }
input:focus, select:focus { outline:none; border-color:#000; box-shadow:0 0 5px rgba(0,0,0,0.2); }
button.primary { background:#000; color:#fff; border:none; padding:0.8rem 1rem; border-radius:6px; cursor:pointer; font-weight:600; transition:0.3s; margin-top:0.5rem; }
button.primary:hover { transform:translateY(-2px); opacity:0.9; }
.wallet-cards { display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem; }
.transactions { max-height:300px; overflow-y:auto; border:1px solid #000; padding:1rem; margin-top:1rem; border-radius:6px; }
.transaction-item { display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid #ccc; }
.card-section { margin-bottom:2rem; }
</style>
</head>

<body>

<header>
    <h1>Kollect</h1>
    <div class="profile">
        <img src="https://i.pravatar.cc/150?img=3" alt="Profile Image" id="profileImage">
        <span id="greeting">Hello!</span>
    </div>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <!-- Wallet Section -->
    <div id="walletTab" class="tab-content active">
        <div class="wallet-section">
            <!-- Currency Tabs -->
            <div class="currency-tabs">
                <div class="currency-tab active" onclick="switchCurrency('NGN')">₦ Naira</div>
                <div class="currency-tab" onclick="switchCurrency('GHS')">GH₵ Cedis</div>
                <div class="currency-tab" onclick="switchCurrency('RWF')">RWF</div>
                <div class="currency-tab more" onclick="showMoreCurrencies()">+ More</div>
            </div>

            <!-- Main Wallet Card -->
            <div class="wallet-card curved-card" id="walletCard">
                <div class="card-top-curve"></div>
                <div class="wallet-header">
                    <span id="currencySymbol">₦</span>
                    <span id="walletTitle">Naira Wallet</span>
                </div>
                <div class="wallet-balance" id="walletBalance">₦0</div>
                <div class="wallet-actions">
                    <button class="primary small" onclick="openTab(null,'fund')">Fund Wallet</button>
                    <button class="primary small" onclick="openTab(null,'payments')">Payment & Transfer</button>
                    <button class="primary small" onclick="openTab(null,'transactions')">Transactions</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fund Wallet Tab -->
    <div id="fund" class="tab-content">
        <h2>Fund Your Wallet</h2>
        <div class="card-section">
            <select id="fundCurrency">
                <option value="NGN">Naira (₦)</option>
                <option value="GH₵">Cedis (GH₵)</option>
                <option value="RWF">Rwandan Franc (RWF)</option>
            </select>
            <input type="number" id="fundAmount" placeholder="Enter Amount">
            <label>Select Funding Method:</label>
            <select id="fundMethod">
                <option value="card">Card Payment</option>
                <option value="bank">Bank Transfer</option>
                <option value="ussd">USSD</option>
            </select>
            <div id="cardFields">
                <input type="text" id="cardNumber" placeholder="Card Number">
                <input type="text" id="cardExpiry" placeholder="MM/YY">
                <input type="text" id="cardCVC" placeholder="CVC">
            </div>
            <button class="primary" onclick="fundWallet()">Fund Wallet</button>
        </div>
    </div>

    <!-- Virtual POS Tab -->
    <div id="pos" class="tab-content">
        <h2>Virtual POS - Accept Payments</h2>
        <div class="wallet-cards" id="posCardsContainer">
            <!-- Cards will be dynamically loaded here -->
        </div>
    </div>

    <!-- Payments & Transfers -->
    <div id="payments" class="tab-content">
        <h2>Payments & Transfers</h2>
        <select id="paymentCurrency">
            <option value="NGN">Naira (₦)</option>
            <option value="GH₵">Cedis (GH₵)</option>
            <option value="RWF">Rwandan Franc (RWF)</option>
        </select>
        <button class="primary" onclick="sendToUser()">Send to Kollect User</button>
        <button class="primary" onclick="withdraw()">Withdraw to Bank</button>
    </div>

    <!-- Transactions Tab -->
    <div id="transactions" class="tab-content">
        <h2>Recent Transactions</h2>
        <div id="transaction-list" class="transactions"></div>
    </div>

</div>

<script src="firebase.js"></script>
<script src="app.js"></script>

<script>
// Tab switching
function openTab(evt, tabName){
    const tabContents = document.querySelectorAll('.tab-content');
    tabContents.forEach(tc => tc.classList.remove('active'));
    const tabBtns = document.querySelectorAll('.tab-btn');
    tabBtns.forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    if(evt) evt.currentTarget.classList.add('active');
}

// Profile greeting
function updateGreeting(name){
    const greeting = document.getElementById('greeting');
    const hour = new Date().getHours();
    let timeGreet = "Hello";
    if(hour<12) timeGreet = "Good morning";
    else if(hour<18) timeGreet = "Good afternoon";
    else timeGreet = "Good evening";
    greeting.innerText = `${timeGreet} ${name}`;
}

// Currency switching
let currentCurrency = 'NGN';
const currencyData = {
    NGN: { symbol: '₦', title: 'Naira Wallet', balanceId: 'balance-ngn' },
    GHS: { symbol: 'GH₵', title: 'Cedis Wallet', balanceId: 'balance-ghc' },
    RWF: { symbol: 'RWF', title: 'Rwandan Franc Wallet', balanceId: 'balance-rwf' }
};
function switchCurrency(currency){
    currentCurrency = currency;
    document.querySelectorAll('.currency-tab').forEach(tab => tab.classList.remove('active'));
    document.querySelector(`.currency-tab:contains(${currency})`)?.classList.add('active');
    document.getElementById('currencySymbol').innerText = currencyData[currency].symbol;
    document.getElementById('walletTitle').innerText = currencyData[currency].title;
    document.getElementById('walletBalance').innerText = currencyData[currency].symbol + "0"; // Firebase balance here
}
function showMoreCurrencies(){ alert("More currencies coming soon!"); }

// Firebase auth
const auth = firebase.auth();
const db = firebase.firestore();
auth.onAuthStateChanged(user => {
    if(user){
        // Display user name
        db.collection("users").doc(user.uid).get().then(doc=>{
            const data = doc.data();
            const name = data.details?.fullName || data.details?.businessName || "User";
            updateGreeting(name);
        });
    } else {
        window.location.href = "login.html";
    }
});

// Logout
function logout(){ auth.signOut(); }
</script>

</body>
</html>
