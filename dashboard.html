<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#f5f5f7;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 1.5rem;
    background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.logo{font-weight:700;font-size:1.3rem;}

.profile-section{
    display:flex;
    align-items:center;
    gap:1rem;
    position:relative;
}

.profile-section img{
    width:35px;height:35px;border-radius:50%;cursor:pointer;
}

/* MAIN WALLET */
.main-wallet{
    margin:1rem;
    background:#fff;
    border-radius:18px;
    padding:1.2rem 1.3rem;
    box-shadow:0 8px 25px rgba(0,0,0,0.06);
}
.main-wallet small{color:#666;}
.main-wallet h2{margin:5px 0;font-size:2rem;}

/* WALLET */
.wallet-container{margin:1rem;}
.wallet-card{
    border-radius:28px;
    padding:1.8rem 1.5rem;
    color:#fff;
    display:none;
}

.balance-label{opacity:0.7;font-size:0.85rem;}
.balance-amount{font-size:2.3rem;font-weight:700;margin:0.5rem 0;}

.currency-cut{
    display:flex;
    gap:10px;
    margin-top:10px;
}
.currency-cut span{
    background:#fff;color:#000;
    padding:4px 10px;border-radius:12px;
    cursor:pointer;font-size:0.8rem;
}
.currency-cut span.active{
    background:#000;color:#fff;
}

/* POS */
.pos-row{
    display:flex;
    gap:1rem;
    padding:1rem;
}
.pos-card{
    flex:1;
    background:#fff;
    border-radius:16px;
    padding:1rem;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    cursor:pointer;
}

/* POS VIEW */
.pos-view{
    margin:1rem;
    display:none;
}
.pos-box{
    background:#fff;
    border-radius:20px;
    padding:1.5rem;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
.pos-box input{
    width:100%;
    padding:0.8rem;
    margin-top:8px;
    border-radius:10px;
    border:1px solid #ddd;
}
.transfer{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}
.transfer button{
    padding:0.7rem;
    border:none;
    border-radius:10px;
    background:#000;
    color:#fff;
    cursor:pointer;
}

/* BACK */
.back{
    margin-bottom:10px;
    cursor:pointer;
    color:#555;
    font-size:0.9rem;
}
</style>
</head>

<body>

<header>
    <div class="logo">Kollect</div>
    <span id="userName">User</span>
</header>

<!-- MAIN WALLET -->
<div class="main-wallet">
    <small>Main Wallet</small>
    <h2>₦245,000</h2>
</div>

<!-- WALLET CARDS -->
<div class="wallet-container">

<div class="wallet-card" style="background:#000;" data-wallet="NGN">
    <div class="balance-label">Available Balance</div>
    <div class="balance-amount">₦245,000</div>
</div>

<div class="wallet-card" style="background:purple;" data-wallet="GHS">
    <div class="balance-label">Available Balance</div>
    <div class="balance-amount">GH₵12,000</div>
</div>

<div class="wallet-card" style="background:#1a237e;" data-wallet="RWF">
    <div class="balance-label">Available Balance</div>
    <div class="balance-amount">RWF 300,000</div>
</div>

<div class="currency-cut">
    <span class="active" onclick="showWallet('NGN',this)">₦</span>
    <span onclick="showWallet('GHS',this)">GH₵</span>
    <span onclick="showWallet('RWF',this)">RWF</span>
</div>

</div>

<!-- POS BUTTONS -->
<div class="pos-row">
    <div class="pos-card" onclick="openPOS('NGN')">
        <strong>₦ Naira Payments</strong>
        <p>Accept payments in Naira</p>
    </div>

    <div class="pos-card" onclick="openPOS('USD')">
        <strong>$ USD Payments</strong>
        <p>Accept payments in USD</p>
    </div>
</div>

<!-- POS VIEW -->
<div class="pos-view" id="posView">
    <div class="pos-box">

        <div class="back" onclick="closePOS()">← Back</div>

        <small>Virtual POS Wallet</small>
        <h2 id="posBalance">₦0.00</h2>

        <input type="number" placeholder="Amount">
        <input type="text" placeholder="Card Number">
        <input type="text" placeholder="MM/YY">
        <input type="text" placeholder="CVC">

        <div class="transfer">
            <button>To Naira</button>
            <button>To Cedis</button>
            <button>To RWF</button>
        </div>

    </div>
</div>

<script>
feather.replace();

/* GREETING */
const h = new Date().getHours();
let g = "Hello";
if(h<12) g="Good Morning";
else if(h<18) g="Good Afternoon";
else g="Good Evening";
document.getElementById("userName").innerText = g;

/* WALLET SWITCH */
function showWallet(wallet,el){
    document.querySelectorAll(".wallet-card").forEach(w=>{
        w.style.display = w.dataset.wallet===wallet ? "block" : "none";
    });
    document.querySelectorAll(".currency-cut span").forEach(s=>s.classList.remove("active"));
    el.classList.add("active");
}
showWallet('NGN', document.querySelector(".currency-cut span"));

/* POS OPEN */
function openPOS(type){
    document.getElementById("posView").style.display="block";

    if(type==="NGN"){
        document.getElementById("posBalance").innerText="₦0.00";
    }else{
        document.getElementById("posBalance").innerText="$0.00";
    }
}

/* POS CLOSE */
function closePOS(){
    document.getElementById("posView").style.display="none";
}
</script>

</body>
</html>
