<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
body {
    margin:0;
    font-family:'Inter', sans-serif;
    background:#f5f5f7;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 1.5rem;
    background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.logo{
    font-weight:700;
    font-size:1.3rem;
}

.profile-section{
    display:flex;
    align-items:center;
    gap:1rem;
    position:relative;
}

.profile-section img{
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
}

.dropdown, .notif-dropdown{
    position:absolute;
    top:45px;
    right:0;
    background:#fff;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    display:none;
    overflow:hidden;
    z-index:20;
}

.dropdown button, .notif-dropdown div{
    border:none;
    background:#fff;
    padding:0.8rem 1.2rem;
    width:100%;
    text-align:left;
    cursor:pointer;
}

.dropdown button:hover, .notif-dropdown div:hover{
    background:#f2f2f2;
}

/* NOTIFICATIONS */
.bell{
    font-size:1.4rem;
    cursor:pointer;
}

/* QUICK ACTIONS */
.quick-actions{
    display:flex;
    gap:15px;
    padding:1rem;
    overflow-x:auto;
}

.quick-action-btn{
    min-width:100px;
    background:#fff;
    border-radius:16px;
    padding:1rem 0.5rem;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    cursor:pointer;
    flex-shrink:0;
    transition:0.3s;
}

.quick-action-btn:hover{
    transform:translateY(-3px);
}

/* WALLET CARDS */
.wallet-container{
    position:relative;
    margin:1rem;
    overflow:hidden;
    height:auto;
}

/* MAIN KOLLECT WALLET */
.main-wallet{
    background:#000;
    color:#fff;
    border-radius:28px;
    padding:1.8rem 1.5rem;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
    margin-bottom:1rem;
}

.main-wallet .balance-label{
    opacity:0.7;
    font-size:0.85rem;
}

.main-wallet .balance-amount{
    font-size:2.3rem;
    font-weight:700;
    margin:0.5rem 0 0;
}

/* WALLET CARDS (Naira, GH₵, RWF) */
.wallet-card{
    border-radius:28px;
    padding:1.8rem 1.5rem;
    color:#fff;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
    transition:transform 0.4s ease, opacity 0.4s ease;
    display:none; /* only active currency will show */
}

/* BALANCE */
.balance-label{
    opacity:0.7;
    font-size:0.85rem;
}

.balance-amount{
    font-size:2.3rem;
    font-weight:700;
    margin:0.5rem 0 1.2rem;
}

/* ACTION BUTTONS - COMPACT */
.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:0.5rem;
}

.action-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:0.7rem;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    font-size:0.85rem;
}

.action-btn:hover{
    background:rgba(255,255,255,0.18);
    transform:translateY(-2px);
}

.icon{
    font-size:1.1rem;
}

/* CURVED CURRENCY CUT */
.currency-cut{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.currency-cut span{
    cursor:pointer;
    font-weight:600;
    padding:0.25rem 0.6rem;
    border-radius:12px;
    transition:0.3s;
    background:#fff;
    color:#000;
    font-size:0.85rem;
}

.currency-cut span.active{
    background:#000;
    color:#fff;
}

/* POS CARDS */
.section{
    padding:1rem;
}

.pos-row{
    display:flex;
    gap:1rem;
    overflow-x:auto;
}

.pos-card{
    min-width:190px;
    background:#fff;
    border-radius:18px;
    padding:1.2rem;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    transition:0.3s;
    cursor:pointer;
}

.pos-card:hover{
    transform:translateY(-3px);
}

/* POS PAYMENT SECTION */
.pos-payment{
    display:none;
    background:#fff;
    border-radius:20px;
    padding:1.5rem;
    margin-top:1rem;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.pos-payment h4{
    margin-bottom:1rem;
}

.pos-payment input, .pos-payment select{
    width:100%;
    padding:0.8rem;
    margin-bottom:0.8rem;
    border-radius:10px;
    border:1px solid #ccc;
}

.pos-payment button{
    padding:0.8rem 1rem;
    border:none;
    border-radius:10px;
    background:#000;
    color:#fff;
    font-weight:600;
    cursor:pointer;
}

/* TRANSACTIONS */
.tx-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:0.5rem;
}

.tx-filters{
    display:flex;
    gap:0.5rem;
}

.tx-filters button{
    padding:0.4rem 0.8rem;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:0.85rem;
    background:#eee;
}

.tx-filters button.active{
    background:#000;
    color:#fff;
}

.tx-search input{
    padding:0.5rem 0.8rem;
    border-radius:8px;
    border:1px solid #ccc;
    width:150px;
}

.tx{
    display:flex;
    justify-content:space-between;
    padding:0.9rem;
    background:#fff;
    border-radius:12px;
    margin-bottom:0.6rem;
    font-size:0.9rem;
}

.credit{color:#16a34a;}
.debit{color:#dc2626;}
</style>
</head>
<body>

<header>
    <div class="logo">Kollect</div>
    <div class="profile-section">
        <i class="bell" data-feather="bell" onclick="toggleNotif()"></i>
        <img src="https://via.placeholder.com/40" onclick="toggleMenu()">
        <span id="userName">User</span>

        <div class="dropdown" id="menu">
            <button onclick="logout()">Logout</button>
        </div>

        <div class="notif-dropdown" id="notifMenu">
            <div>Payment received</div>
            <div>Withdrawal successful</div>
            <div>Promo: Top up for 10% bonus</div>
        </div>
    </div>
</header>

<!-- MAIN KOLLECT WALLET -->
<div class="wallet-container">
    <div class="main-wallet">
        <div class="balance-label">Kollect Wallet Balance</div>
        <div class="balance-amount" id="mainBalance">₦500,000</div>
    </div>
</div>

<!-- POS CARDS -->
<div class="section">
    <h3>Virtual POS</h3>
    <div class="pos-row">
        <div class="pos-card" onclick="openPOS('₦')">
            <strong>₦ Naira POS</strong>
        </div>
        <div class="pos-card" onclick="openPOS('$')">
            <strong>$ USD POS</strong>
        </div>
        <div class="pos-card" onclick="openPOS('GH₵')">
            <strong>GH₵ POS</strong>
        </div>
        <div class="pos-card" onclick="openPOS('RWF')">
            <strong>RWF POS</strong>
        </div>
    </div>

    <!-- POS Payment Section -->
    <div class="pos-payment" id="posPaymentSection">
        <h4 id="posTitle">POS Payment</h4>
        <div>
            <label>POS Wallet Balance: <span id="posBalance">₦0</span></label>
        </div>
        <div>
            <label>Select Wallet to Send Money:</label>
            <select id="targetWallet">
                <option value="NGN">₦ Naira Wallet</option>
                <option value="GHS">GH₵ Wallet</option>
                <option value="RWF">RWF Wallet</option>
            </select>
        </div>
        <input type="number" placeholder="Amount">
        <input type="text" placeholder="Card Number">
        <input type="text" placeholder="MM/YY">
        <input type="text" placeholder="CVC">
        <button onclick="submitPayment()">Charge / Receive Payment</button>
    </div>
</div>

<!-- TRANSACTIONS -->
<div class="section">
    <div class="tx-header">
        <div class="tx-filters">
            <button class="active" onclick="filterTx('all')">All</button>
            <button onclick="filterTx('credit')">Credits</button>
            <button onclick="filterTx('debit')">Debits</button>
        </div>
        <div class="tx-search">
            <input type="text" placeholder="Search" id="txSearch" oninput="searchTx()">
        </div>
    </div>

    <div id="txList">
        <div class="tx" data-type="credit">
            <span>Fund Wallet</span><span class="credit">+ ₦50,000</span>
        </div>
        <div class="tx" data-type="debit">
            <span>Sent to David</span><span class="debit">- ₦5,000</span>
        </div>
        <div class="tx" data-type="credit">
            <span>Received from Jane</span><span class="credit">+ ₦20,000</span>
        </div>
    </div>
</div>

<script>
feather.replace();

/* PROFILE MENU */
function toggleMenu(){
    const menu = document.getElementById("menu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

/* NOTIFICATIONS */
function toggleNotif(){
    const notif = document.getElementById("notifMenu");
    notif.style.display = notif.style.display === "block" ? "none" : "block";
}

/* LOGOUT */
function logout(){
    alert("Logged out");
    window.location.href = "login.html";
}

/* GREETING */
const h = new Date().getHours();
let g = "Hello";
if(h<12) g="Good Morning";
else if(h<18) g="Good Afternoon";
else g="Good Evening";
document.getElementById("userName").innerText = g + " 👋";

/* OPEN POS PAYMENT SECTION */
function openPOS(currency){
    const posSection = document.getElementById("posPaymentSection");
    const posTitle = document.getElementById("posTitle");
    const posBalance = document.getElementById("posBalance");

    posTitle.innerText = currency + " POS Payment";

    // Dummy balances for each POS wallet
    if(currency==='₦') posBalance.innerText = '₦245,000';
    else if(currency==='$') posBalance.innerText = '$1,200';
    else if(currency==='GH₵') posBalance.innerText = 'GH₵12,000';
    else if(currency==='RWF') posBalance.innerText = 'RWF 300,000';

    posSection.style.display = 'block';
}

/* SUBMIT PAYMENT */
function submitPayment(){
    const wallet = document.getElementById("targetWallet").value;
    alert('Payment submitted to ' + wallet + ' wallet!');
}

/* TRANSACTION FILTER */
function filterTx(type){
    const buttons = document.querySelectorAll(".tx-filters button");
    buttons.forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");

    const txs = document.querySelectorAll("#txList .tx");
    txs.forEach(tx => {
        if(type==="all" || tx.dataset.type===type) tx.style.display="flex";
        else tx.style.display="none";
    });
}

/* SEARCH TX */
function searchTx(){
    const val = document.getElementById("txSearch").value.toLowerCase();
    const txs = document.querySelectorAll("#txList .tx");
    txs.forEach(tx => {
        const text = tx.innerText.toLowerCase();
        tx.style.display = text.includes(val) ? "flex" : "none";
    });
}
</script>
</body>
</html>
