<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#f5f5f7;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1.2rem;
}

.logo{
    font-weight:700;
    font-size:1.2rem;
}

.profile{
    display:flex;
    align-items:center;
    gap:0.6rem;
    cursor:pointer;
    position:relative;
}

.profile img{
    width:35px;
    height:35px;
    border-radius:50%;
}

.dropdown{
    position:absolute;
    top:45px;
    right:0;
    background:#fff;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    display:none;
    overflow:hidden;
}

.dropdown button{
    border:none;
    background:#fff;
    padding:0.8rem 1.2rem;
    width:100%;
    text-align:left;
    cursor:pointer;
}

.dropdown button:hover{
    background:#f2f2f2;
}

/* WALLET CARD */
.wallet-card{
    position:relative;
    background:#000;
    color:#fff;
    margin:1rem;
    padding:2rem;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
    transition:0.4s ease;
}

/* BALANCE */
.balance-label{
    opacity:0.7;
    font-size:0.85rem;
}

.balance-amount{
    font-size:2.6rem;
    font-weight:700;
    margin:0.5rem 0 1.8rem;
}

/* ACTION BUTTONS */
.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:0.8rem;
}

.action-btn{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    padding:0.9rem;
    border-radius:14px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.action-btn:hover{
    background:rgba(255,255,255,0.18);
    transform:translateY(-2px);
}

/* CURVED CUT */
.currency-cut{
    position:absolute;
    top:50%;
    right:-60px;
    transform:translateY(-50%);
    width:230px;
    height:95px;
    background:#f5f5f7;
    border-radius:100px 0 0 100px;
    display:flex;
    align-items:center;
    gap:25px;
    padding-left:25px;
    box-shadow:-8px 0 25px rgba(0,0,0,0.1);
}

/* CURRENCY ITEMS */
.currency-cut span{
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.currency-cut span:hover{
    transform:scale(1.1);
}

/* DIVIDER */
.currency-cut span:not(:last-child)::after{
    content:"";
    display:inline-block;
    width:1px;
    height:12px;
    background:#ccc;
    margin-left:10px;
}

/* POS */
.section{
    padding:1rem;
}

.pos-row{
    display:flex;
    gap:1rem;
    overflow-x:auto;
}

.pos-card{
    min-width:190px;
    background:#fff;
    border-radius:18px;
    padding:1.2rem;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    transition:0.3s;
}

.pos-card:hover{
    transform:translateY(-3px);
}

/* TRANSACTIONS */
.tx{
    display:flex;
    justify-content:space-between;
    padding:0.9rem;
    background:#fff;
    border-radius:12px;
    margin-bottom:0.6rem;
    font-size:0.9rem;
}

.credit{color:#16a34a;}
.debit{color:#dc2626;}
</style>
</head>

<body>

<header>
    <div class="logo">Kollect</div>

    <div class="profile" onclick="toggleMenu()">
        <img src="https://via.placeholder.com/40">
        <span id="userName">User</span>

        <div class="dropdown" id="menu">
            <button onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<!-- WALLET -->
<div class="wallet-card" id="walletCard">

    <div class="balance-label">Available Balance</div>
    <div class="balance-amount" id="balance">₦245,000</div>

    <div class="actions">
        <div class="action-btn">Send</div>
        <div class="action-btn">To Bank</div>
        <div class="action-btn">Withdraw</div>
        <div class="action-btn">Fund</div>
    </div>

    <!-- CURVED CUT -->
    <div class="currency-cut">
        <span onclick="switchWallet(1)">GH₵</span>
        <span onclick="switchWallet(2)">RWF</span>
        <span>+</span>
    </div>

</div>

<!-- POS -->
<div class="section">
    <h3>Virtual POS</h3>
    <div class="pos-row">
        <div class="pos-card">
            <strong>₦ Naira Payments</strong>
            <p style="font-size:0.8rem;color:#555;">Accept payments in Naira</p>
        </div>

        <div class="pos-card">
            <strong>$ USD Payments</strong>
            <p style="font-size:0.8rem;color:#555;">Accept payments in USD</p>
        </div>

        <div class="pos-card">
            <strong>+ More</strong>
        </div>
    </div>
</div>

<!-- TRANSACTIONS -->
<div class="section">
    <h3>Recent Activity</h3>

    <div class="tx">
        <span>Fund Wallet</span>
        <span class="credit">+ ₦50,000</span>
    </div>

    <div class="tx">
        <span>Sent to David</span>
        <span class="debit">- ₦5,000</span>
    </div>
</div>

<script>

/* PROFILE MENU */
function toggleMenu(){
    const menu = document.getElementById("menu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

/* LOGOUT */
function logout(){
    alert("Logged out");
    window.location.href = "login.html";
}

/* GREETING */
const h = new Date().getHours();
let g = "Hello";

if(h<12) g="Good Morning";
else if(h<18) g="Good Afternoon";
else g="Good Evening";

document.getElementById("userName").innerText = g + " 👋";

/* WALLET SWITCH */
let current = 0;

const wallets = [
    {balance:"₦245,000", color:"#000"},
    {balance:"GH₵12,000", color:"#0a3d2c"},
    {balance:"RWF 300,000", color:"#1a237e"}
];

function switchWallet(i){
    current = i;

    const card = document.getElementById("walletCard");
    card.style.opacity = 0;

    setTimeout(()=>{
        card.style.background = wallets[current].color;
        document.getElementById("balance").innerText = wallets[current].balance;
        card.style.opacity = 1;
    },200);
}

/* SWIPE */
let startX=0;

const card = document.getElementById("walletCard");

card.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
});

card.addEventListener("touchend",e=>{
    let endX=e.changedTouches[0].clientX;

    if(startX-endX>50){
        current=(current+1)%wallets.length;
        switchWallet(current);
    }

    if(endX-startX>50){
        current=(current-1+wallets.length)%wallets.length;
        switchWallet(current);
    }
});
</script>

</body>
</html>
