<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/feather-icons"></script>

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#f5f5f7;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:1rem 1.5rem;
    background:#fff;
}

.logo{font-weight:700;font-size:1.3rem;}

/* SWITCHER */
#dashboardSwitcher{
    display:flex;
    position:relative;
    margin:1rem auto;
    width:90%;
    max-width:400px;
    height:50px;
    background:#000;
    border-radius:30px;
}

.switcher-option{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:600;
    cursor:pointer;
    z-index:2;
    color:#000; /* FIXED */
}

.switcher-option.active{
    color:#000;
}

/* WHITE SLIDER */
#switcherIndicator{
    position:absolute;
    width:50%;
    height:100%;
    background:#fff;
    border-radius:30px;
    transition:0.3s;
    left:0;
}

/* QUICK ACTIONS */
.quick-actions{
    display:flex;
    gap:15px;
    padding:1rem;
    overflow-x:auto;
}

.quick-action-btn{
    min-width:100px;
    background:#fff;
    border-radius:16px;
    padding:1rem;
    text-align:center;
}

/* WALLET */
.wallet-container{margin:1rem;}

.wallet-card{
    border-radius:28px;
    padding:1.5rem;
    color:#fff;
    display:none;
}

.balance-amount{
    font-size:2rem;
    font-weight:700;
}

/* BUSINESS CARD EXTRA */
.business-insight{
    margin-top:10px;
    font-size:0.8rem;
    opacity:0.8;
}

/* POS */
.section{padding:1rem;}
.pos-row{display:flex;gap:1rem;overflow:auto;}

.pos-card{
    min-width:180px;
    background:#fff;
    padding:1rem;
    border-radius:15px;
}

/* TRANSACTIONS */
.tx{
    background:#fff;
    margin:10px;
    padding:10px;
    border-radius:10px;
}

/* BUSINESS SECTION */
#businessSection{display:none;}
</style>
</head>

<body>

<header>
<div class="logo">Kollect</div>
</header>

<!-- SWITCHER -->
<div id="dashboardSwitcher">
    <div id="switcherIndicator"></div>

    <div class="switcher-option active" onclick="switchDashboard('individual')">
        Individual
    </div>

    <div class="switcher-option" onclick="switchDashboard('business')">
        Business
    </div>
</div>

<!-- QUICK ACTIONS -->
<div class="quick-actions">
    <div class="quick-action-btn">Airtime</div>
    <div class="quick-action-btn">Data</div>
</div>

<!-- INDIVIDUAL -->
<div id="individualSection">

    <div class="wallet-container">
        <div class="wallet-card" id="individualWallet" style="background:#000;display:block;">
            <div>Available Balance</div>
            <div class="balance-amount">₦245,000</div>
        </div>
    </div>

</div>

<!-- BUSINESS -->
<div id="businessSection"></div>

<!-- POS -->
<div class="section">
    <h3>Virtual POS</h3>
    <div class="pos-row">
        <div class="pos-card">₦ Payments</div>
        <div class="pos-card">$ Payments</div>
    </div>
</div>

<!-- TRANSACTIONS -->
<div class="tx">+ ₦50,000</div>
<div class="tx">- ₦5,000</div>

<script>
feather.replace();

let current = "individual";

function switchDashboard(type){
    current = type;

    const indicator = document.getElementById("switcherIndicator");
    const options = document.querySelectorAll(".switcher-option");

    options.forEach(o => o.classList.remove("active"));

    if(type === "individual"){
        indicator.style.left = "0%";
        options[0].classList.add("active");

        document.getElementById("individualSection").style.display="block";
        document.getElementById("businessSection").style.display="none";
    }else{
        indicator.style.left = "50%";
        options[1].classList.add("active");

        document.getElementById("individualSection").style.display="none";

        loadBusiness();
        document.getElementById("businessSection").style.display="block";
    }
}

/* LOAD BUSINESS */
function loadBusiness(){

    let section = document.getElementById("businessSection");

    if(section.innerHTML !== "") return;

    section.innerHTML = `
        <div class="wallet-container">

            <!-- ONLY ONE WALLET -->
            <div class="wallet-card" style="background:#000;display:block;">
                <div>Business Balance</div>
                <div class="balance-amount">₦845,000</div>

                <!-- 🔥 SMART FEATURES -->
                <div class="business-insight">
                    💡 Today’s Sales: ₦120,000
                </div>

                <div class="business-insight">
                    📈 Weekly Growth: +18%
                </div>

                <div class="business-insight">
                    ⭐ Top Customer: David
                </div>

            </div>

        </div>

        <!-- SMART PAYMENTS -->
        <div class="section">
            <h3>Smart Payments</h3>
            <div class="pos-row">
                <div class="pos-card">Payment Link</div>
                <div class="pos-card">Split Payment</div>
                <div class="pos-card">QR Pay</div>
            </div>
        </div>

        <!-- AI INSIGHTS -->
        <div class="section">
            <h3>AI Insights</h3>
            <div class="pos-card">Next week sales prediction: ₦300k</div>
        </div>
    `;
}
</script>

</body>
</html>
