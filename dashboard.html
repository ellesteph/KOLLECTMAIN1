<!-- ADD THIS BELOW HEADER (for navigation) -->
<div style="display:flex; align-items:flex-start;">
    <!-- Vertical Navigation Line -->
    <div id="dashboardLine" style="
        position:relative;
        width:6px;
        background:linear-gradient(to bottom,#7B3FE4,#4a148c);
        border-radius:3px;
        margin:1rem;
        padding:0.5rem 0;
        height:120px;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
    ">
        <div class="line-marker" id="individualMarker" style="
            width:14px;
            height:14px;
            border-radius:50%;
            background:#ccc;
            cursor:pointer;
            transition:all 0.3s ease;
        " title="Individual" onclick="switchDashboard('individual')"></div>

        <div class="line-marker" id="businessMarker" style="
            width:14px;
            height:14px;
            border-radius:50%;
            background:#7B3FE4;
            cursor:pointer;
            transition:all 0.3s ease;
        " title="Business" onclick="switchDashboard('business')"></div>
    </div>

    <!-- Empty Hamburger Menu -->
    <div id="hamburgerMenu" style="
        margin-left:1rem;
        cursor:pointer;
        padding:0.5rem;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        height:24px;
    " onclick="toggleHamburger()">
        <span style="width:24px;height:3px;background:#000;border-radius:2px;display:block;"></span>
        <span style="width:24px;height:3px;background:#000;border-radius:2px;display:block;"></span>
        <span style="width:24px;height:3px;background:#000;border-radius:2px;display:block;"></span>
    </div>
</div>
