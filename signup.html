<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect | Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Inter', sans-serif; background:#eef2f3; color:#000; }
.container { max-width:500px; margin:4rem auto; padding:2rem; border-radius:12px; background:linear-gradient(135deg,#f5f7fa,#c3cfe2); box-shadow:0 10px 30px rgba(0,0,0,0.1); }
h2 { text-align:center; margin-bottom:2rem; font-weight:700; }
input, select { width:100%; padding:0.8rem; margin:0.8rem 0; border:1px solid #000; border-radius:6px; font-size:1rem; }
input:focus, select:focus { outline:none; border-color:#6a11cb; box-shadow:0 0 5px rgba(106,17,203,0.3); }
button.primary { width:100%; padding:0.8rem; background:linear-gradient(135deg,#6a11cb,#2575fc); color:#fff; border:none; font-weight:600; font-size:1rem; border-radius:6px; cursor:pointer; margin-top:1rem; transition:0.3s; }
button.primary:hover { opacity:0.9; transform:translateY(-2px); }
.tab-selector { display:flex; justify-content:space-around; margin-bottom:2rem; }
.tab-selector button { flex:1; padding:0.8rem 1rem; font-weight:600; border:none; cursor:pointer; border-radius:6px; transition:0.3s; background:#fff; border:2px solid #6a11cb; color:#6a11cb; }
.tab-selector button.active { background:linear-gradient(135deg,#6a11cb,#2575fc); color:#fff; }
.tab-content { display:none; opacity:0; transform:translateY(20px); transition: all 0.5s ease; }
.tab-content.active { display:block; opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div class="container">
    <h2>Create Your Kollect Account</h2>

    <!-- User Type Tabs -->
    <div class="tab-selector">
        <button id="individualBtn" class="active" onclick="showUserType('individual')">Individual</button>
        <button id="businessBtn" onclick="showUserType('business')">Business</button>
    </div>

    <!-- Individual Signup -->
    <div id="individual" class="tab-content active">
        <input id="fullName" placeholder="Full Name">
        <input id="email" type="email" placeholder="Email">
        <input id="phone" type="tel" placeholder="Phone Number">
        <input id="password" type="password" placeholder="Password">
        <button class="primary" onclick="signUpUser()">Sign Up</button>
    </div>

    <!-- Business Signup -->
    <div id="business" class="tab-content">
        <input id="businessName" placeholder="Business Name">
        <select id="businessType">
            <option value="">Select Business Type</option>
            <option value="Retail">Retail</option>
            <option value="Food & Beverage">Food & Beverage</option>
            <option value="Tech">Tech</option>
            <option value="Services">Services</option>
            <option value="Other">Other</option>
        </select>
        <input id="emailBus" type="email" placeholder="Email">
        <input id="phoneBus" type="tel" placeholder="Phone Number">
        <input id="passwordBus" type="password" placeholder="Password">
        <button class="primary" onclick="signUpUser()">Sign Up</button>
    </div>
</div>

<!-- Firebase 12 ES Module -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyBLN0O36j1DWxUN5U1B4iuP6kH-YNUENkk",
    authDomain: "kollect-aa5a3.firebaseapp.com",
    projectId: "kollect-aa5a3",
    storageBucket: "kollect-aa5a3.firebasestorage.app",
    messagingSenderId: "57011462366",
    appId: "1:57011462366:web:a060ffe0e8be47f61ae24f",
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Tab switch
function showUserType(type){
    const individual = document.getElementById("individual");
    const business = document.getElementById("business");
    const individualBtn = document.getElementById("individualBtn");
    const businessBtn = document.getElementById("businessBtn");
    if(type==='individual'){
        individual.classList.add("active");
        business.classList.remove("active");
        individualBtn.classList.add("active");
        businessBtn.classList.remove("active");
    } else {
        individual.classList.remove("active");
        business.classList.add("active");
        individualBtn.classList.remove("active");
        businessBtn.classList.add("active");
    }
}

// Signup function
async function signUpUser(){
    const isIndividual = document.getElementById("individual").classList.contains("active");
    let email, password, userData = {};

    if(isIndividual){
        const fullName = document.getElementById("fullName").value;
        email = document.getElementById("email").value;
        password = document.getElementById("password").value;
        const phone = document.getElementById("phone").value;
        if(!fullName || !email || !password || !phone) return alert("Please fill all fields");
        userData = { fullName, phone };
    } else {
        const businessName = document.getElementById("businessName").value;
        const businessType = document.getElementById("businessType").value;
        email = document.getElementById("emailBus").value;
        password = document.getElementById("passwordBus").value;
        const phone = document.getElementById("phoneBus").value;
        if(!businessName || !businessType || !email || !password || !phone) return alert("Please fill all fields");
        userData = { businessName, businessType, phone };
    }

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;
        await setDoc(doc(db, "users", uid), {
            userType: isIndividual ? "individual" : "business",
            details: userData,
            wallet: { NGN:0, GHS:0, RWF:0 },
            transactions: []
        });
        alert("Account created successfully!");
        window.location.href = "dashboard.html";
    } catch(error) {
        alert(error.message);
    }
}
</script>

</body>
</html>
