<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollect | Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Inter', sans-serif; background:#f5f7fa; color:#000; }
.container { max-width:500px; margin:4rem auto; padding:2rem; border-radius:12px; background:#fff; box-shadow:0 15px 30px rgba(0,0,0,0.1); }
h2 { text-align:center; margin-bottom:2rem; font-weight:700; background:linear-gradient(90deg,#007cf0,#00dfd8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
input, select { width:100%; padding:0.9rem; margin:0.8rem 0; border:1px solid #ccc; border-radius:8px; font-size:1rem; transition: all 0.3s ease; }
input:focus, select:focus { border-color:#007cf0; box-shadow:0 0 5px rgba(0,124,240,0.3); outline:none; }
button.primary { width:100%; padding:1rem; background:#000; color:#fff; border:none; font-weight:600; font-size:1rem; border-radius:10px; cursor:pointer; margin-top:1.5rem; transition: all 0.3s ease; }
button.primary:hover { transform:translateY(-2px); opacity:0.9; }
.tab-selector { display:flex; justify-content:space-around; margin-bottom:2rem; }
.tab-selector button { flex:1; padding:0.8rem 1rem; font-weight:600; border:none; cursor:pointer; border-radius:8px; transition: all 0.3s ease; background:#fff; border:2px solid #000; margin:0 0.2rem; }
.tab-selector button.active { background:#000; color:#fff; }
.tab-content { display:none; opacity:0; transform:translateY(20px); transition: all 0.5s ease; }
.tab-content.active { display:block; opacity:1; transform:translateY(0); }
.signup-footer { text-align:center; margin-top:1rem; }
.signup-footer a { color:#007cf0; text-decoration:none; font-weight:600; }
.signup-footer a:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="container">
    <h2>Create Your Kollect Account</h2>

    <!-- User Type Tabs -->
    <div class="tab-selector">
        <button id="individualBtn" class="active" onclick="showUserType('individual')">Individual</button>
        <button id="businessBtn" onclick="showUserType('business')">Business</button>
    </div>

    <!-- Individual Signup -->
    <div id="individual" class="tab-content active">
        <input id="fullName" placeholder="Full Name">
        <input id="email" type="email" placeholder="Email">
        <input id="phone" type="tel" placeholder="Phone Number">
        <input id="password" type="password" placeholder="Password">
        <button class="primary" onclick="signUp()">Sign Up</button>
    </div>

    <!-- Business Signup -->
    <div id="business" class="tab-content">
        <input id="businessName" placeholder="Business Name">
        <select id="businessType">
            <option value="">Select Business Type</option>
            <option value="Retail">Retail</option>
            <option value="Food & Beverage">Food & Beverage</option>
            <option value="Tech">Tech</option>
            <option value="Services">Services</option>
            <option value="Other">Other</option>
        </select>
        <input id="emailBus" type="email" placeholder="Email">
        <input id="phoneBus" type="tel" placeholder="Phone Number">
        <input id="passwordBus" type="password" placeholder="Password">
        <button class="primary" onclick="signUp()">Sign Up</button>
    </div>

    <div class="signup-footer">
        Already have an account? <a href="login.html">Sign In</a>
    </div>
</div>

<!-- 🔥 Firebase v8 (compat) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyBLN0O36j1DWxUN5U1B4iuP6kH-YNUENkk",
    authDomain: "kollect-aa5a3.firebaseapp.com",
    projectId: "kollect-aa5a3",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Auto redirect if already logged in
auth.onAuthStateChanged(user => {
    if(user){
        window.location.href = "dashboard.html";
    }
});

// Tab toggle
function showUserType(type){
    const individual = document.getElementById("individual");
    const business = document.getElementById("business");
    const individualBtn = document.getElementById("individualBtn");
    const businessBtn = document.getElementById("businessBtn");

    if(type==='individual'){
        individual.classList.add("active");
        business.classList.remove("active");
        individualBtn.classList.add("active");
        businessBtn.classList.remove("active");
    } else {
        individual.classList.remove("active");
        business.classList.add("active");
        individualBtn.classList.remove("active");
        businessBtn.classList.add("active");
    }
}

// Sign Up function
function signUp(){
    const activeTab = document.querySelector('.tab-content.active'); 
    const btn = activeTab.querySelector('button.primary');
    btn.disabled = true;
    btn.innerText = "Creating Account...";

    const isIndividual = document.getElementById("individual").classList.contains("active");
    let userData = {};
    let email, phone, password;

    if(isIndividual){
        const fullName = document.getElementById("fullName").value.trim();
        email = document.getElementById("email").value.trim();
        phone = document.getElementById("phone").value.trim();
        password = document.getElementById("password").value.trim();

        if(!fullName || !email || !phone || !password){
            alert("Please fill all fields");
            btn.disabled = false; btn.innerText = "Sign Up"; 
            return;
        }
        userData = { fullName, email, phone };
    } else {
        const businessName = document.getElementById("businessName").value.trim();
        const businessType = document.getElementById("businessType").value;
        email = document.getElementById("emailBus").value.trim();
        phone = document.getElementById("phoneBus").value.trim();
        password = document.getElementById("passwordBus").value.trim();

        if(!businessName || !businessType || !email || !phone || !password){
            alert("Please fill all fields");
            btn.disabled = false; btn.innerText = "Sign Up"; 
            return;
        }
        userData = { businessName, businessType, email, phone };
    }

    auth.createUserWithEmailAndPassword(email, password)
    .then(userCredential=>{
        const userId = userCredential.user.uid;
        return db.collection("users").doc(userId).set({
            userType: isIndividual ? "individual" : "business",
            details: userData,
            wallet: { NGN:0, GHS:0, RWF:0 },
            transactions: []
        });
    })
    .then(()=>{
        alert("Account created successfully! Redirecting...");
        window.location.href = "dashboard.html";
    })
    .catch(error=>{
        if(error.code==='auth/email-already-in-use'){
            alert("This email is already registered. Please sign in instead.");
            window.location.href = "login.html";
        } else {
            alert(error.message);
        }
        btn.disabled = false;
        btn.innerText = "Sign Up";
    });
}
</script>
</body>
</html>
